[project]
name = "lazy-scholar"
version = "0.1.0"
description = "Nightly agent that hunts for scholarships, grants, paid internships and prize hackathons, judged by Gemma."
authors = [
    { name = "Chamod Dhananjaya", email = "dhananjayachamod0754@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.32.0",
    "python-dotenv>=1.2.4",
    "serpapi>=1.1.2",
]

[project.scripts]
lazy-scholar = "lazy_scholar:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
